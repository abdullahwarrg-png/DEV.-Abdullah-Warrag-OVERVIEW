<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box}html,body{margin:0;width:1280px;height:520px;overflow:hidden}body{font-family:Arial,Helvetica,sans-serif;background:#171b19;color:#f4f5f1}.banner{height:100%;padding:58px 64px;position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:44px}.banner:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(90deg,#000,transparent 62%)}.copy{position:relative;z-index:1;align-self:center}.eyebrow{display:flex;align-items:center;gap:9px;color:#8fd3b7;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:2px}.eyebrow i{width:8px;height:8px;border-radius:50%;background:#47c28f;box-shadow:0 0 0 5px rgba(71,194,143,.13)}h1{max-width:600px;margin:24px 0 18px;font-size:58px;line-height:1.02;letter-spacing:0}h1 span{color:#99a19b}p{max-width:540px;color:#c1c6c2;font-size:17px;line-height:1.55}.stack{margin-top:34px;display:flex;gap:8px}.stack span{padding:7px 10px;border:1px solid #3a413c;border-radius:4px;background:#242925;color:#cfd3cf;font-size:11px}.visual{position:relative;z-index:1;align-self:center;height:365px}.window{position:absolute;overflow:hidden;border:1px solid #505852;border-radius:7px;background:#f4f5f2;box-shadow:0 32px 60px rgba(0,0,0,.35)}.window.primary{width:520px;height:330px;right:-40px;top:0;transform:rotate(1.5deg)}.window.secondary{width:330px;height:210px;left:-25px;bottom:-8px;transform:rotate(-3deg);border-color:#5b655f}.bar{height:25px;padding:0 9px;display:flex;align-items:center;gap:5px;background:#292e2a}.bar i{width:6px;height:6px;border-radius:50%;background:#657068}.bar i:first-child{background:#ef6a58}.window img{width:100%;height:calc(100% - 25px);object-fit:cover;object-position:top left}.secondary img{filter:saturate(.9)}
</style>
</head>
<body><div class="banner"><section class="copy"><div class="eyebrow"><i></i>Full-stack + applied AI</div><h1>Software for <span>complex work.</span></h1><p>Reliable services, inspectable AI workflows, and data-rich interfaces built with product discipline.</p><div class="stack"><span>TypeScript</span><span>Next.js</span><span>Python</span><span>PostgreSQL</span><span>AI systems</span></div></section><section class="visual"><div class="window primary"><div class="bar"><i></i><i></i><i></i></div><img src="signalops.png"></div><div class="window secondary"><div class="bar"><i></i><i></i><i></i></div><img src="context-lab.png"></div></section></div></body>
</html>
